{# Inline line icons (paths adapted from Feather Icons, MIT licence). #}
{% macro icon(name, cls="icon") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "flame" -%}
  <path d="M12 2c3.5 4.4 6 8 6 12a6 6 0 0 1-12 0c0-2.4 1-4.6 2.5-6.5.3 1.8 1.2 3 2.5 3.5C11 8 11 5 12 2z"/>
{%- elif name == "tool" -%}
  <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
{%- elif name == "droplet" -%}
  <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
{%- elif name == "shield" -%}
  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>
{%- elif name == "clipboard" -%}
  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><polyline points="9 14 11 16 15 12"/>
{%- elif name == "check" -%}
  <polyline points="20 6 9 17 4 12"/>
{%- elif name == "phone" -%}
  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
{%- elif name == "mail" -%}
  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
{%- elif name == "map" -%}
  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
{%- elif name == "arrow-left" -%}
  <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
{%- elif name == "alert" -%}
  <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro brand_mark() -%}

  <path fill="#E8503A" d="M32 2c8 10 14 18 14 28 0 8-6 14-14 14s-14-6-14-14c0-10 6-18 14-28z"/>
  <path fill="#fff" d="M32 20c4 5 6 9 6 12 0 3-3 6-6 6s-6-3-6-6c0-3 2-7 6-12z"/>
</svg>
{%- endmacro %}
